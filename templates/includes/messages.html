{% if messages %}
<div class="container messages-region" role="status" aria-live="polite">
  {% for message in messages %}
  <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show" role="alert">
    {% if message.tags == 'success' %}<i class="bi bi-check-circle-fill" aria-hidden="true"></i>{% elif message.tags == 'error' %}<i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>{% else %}<i class="bi bi-info-circle-fill" aria-hidden="true"></i>{% endif %}
    <span>{{ message }}</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Dismiss message"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
